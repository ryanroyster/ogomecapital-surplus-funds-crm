let currentCommLeadId = null;

function getLeadById(id){
  return leads.find(l=>String(l.id)===String(id));
}
function ensureCommState(lead){
  if(!lead.commLog) lead.commLog=[];
  if(!lead.phone) lead.phone="";
  if(!lead.smsDraft) lead.smsDraft="";
}
function openLeadComm(id){
  const lead=getLeadById(id); if(!lead) return;
  currentCommLeadId=id; ensureCommState(lead);
  document.getElementById('commLeadName').textContent=lead.name||'Lead';
  document.getElementById('commLeadMeta').textContent=`${lead.stage||'New Lead'} · ${lead.county||''}${lead.county&&lead.state?', ':''}${lead.state||''}`;
  document.getElementById('commPhone').value=lead.phone||'';
  document.getElementById('commMessage').value=lead.smsDraft||'';
  const inbound=document.getElementById('commInboundNote'); if(inbound) inbound.value='';
  const info=[
    ['Stage',CRMOperations.label(lead)],
    ['Compliance Clearance',lead.compliance_status||'NOT_REVIEWED'],
    ['Priority',lead.priority||'—'],
    ['Closing Probability',lead.closingProbability!=null?`${Math.round(lead.closingProbability)}%`:'—'],
    ['Expected Opportunity',lead.expectedOpportunityValue?fmt(lead.expectedOpportunityValue):(lead.excess&&lead.closingProbability?fmt(lead.excess*lead.closingProbability/100):'—')],
    ['Excess Proceeds',lead.excess?fmt(lead.excess):'—'],
    ['Property',lead.address||'—'],
    ['APN / Parcel',lead.apn||'—'],
    ['Property Type',lead.propertyType||'—'],
    ['Ownership',lead.ownershipType||'—'],
    ['Jurisdiction',`${lead.county||'—'}${lead.state?', '+lead.state:''}`],
    ['Contact Status',lead.contactStatus||'Not contacted'],
    ['Next Action',lead.nextAction||'—'],
    ['Notes',lead.notes||'—']
  ];
  document.getElementById('commLeadInfo').innerHTML=`<div class="profile-grid">`+info.map(([k,v])=>`<div class="profile-item"><div class="profile-label">${esc(k)}</div><div class="profile-value">${esc(String(v))}</div></div>`).join('')+`</div>`;
  if(window.renderLeadOperations)renderLeadOperations(lead);
  renderCommLog(lead);
  updateCharCount();
  document.getElementById('leadCommModal').classList.add('open');
}
function closeLeadComm(){ document.getElementById('leadCommModal').classList.remove('open'); }
function persistLeadComm(lead){
  save();
}
function updateCharCount(){
  const el=document.getElementById('commMessage');
  const c=document.getElementById('commCharCount');
  if(el&&c)c.textContent=`${el.value.length} characters`;
}
function focusMessageBox(){ document.getElementById('commMessage').focus(); }
function saveCommDraft(){
  const lead=getLeadById(currentCommLeadId); if(!lead)return;
  ensureCommState(lead);
  lead.phone=document.getElementById('commPhone').value.trim();
  lead.smsDraft=document.getElementById('commMessage').value;
  persistLeadComm(lead); renderCommunications();
}
function logComm(type,detail){
  const lead=getLeadById(currentCommLeadId); if(!lead)return;
  ensureCommState(lead);
  lead.commLog.unshift({type,detail,at:new Date().toISOString()});
  persistLeadComm(lead); renderCommLog(lead); renderCommunications();
}
function renderCommLog(lead){
  const el=document.getElementById('commLog'); if(!el)return;
  ensureCommState(lead);
  if(!lead.commLog.length){el.innerHTML='<div class="muted" style="padding:18px;text-align:center">No message or call history yet.</div>';return;}
  const items=[...lead.commLog].sort((a,b)=>new Date(a.at)-new Date(b.at));
  el.innerHTML=items.map(x=>{
    const inbound=x.type==='Inbound reply'||x.type==='Inbound note';
    const call=x.type==='Call launched'||x.type==='Call note';
    const cls=inbound?'msg inbound':call?'msg system':'msg outbound';
    const label=inbound?'Lead':call?'Call activity':'You';
    return `<div class="${cls}">
      <div class="msg-label">${esc(label)} · ${esc(new Date(x.at).toLocaleString())}</div>
      <div class="msg-body">${esc(x.detail||x.type||'')}</div>
    </div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}

function logInboundReply(){
  const lead=getLeadById(currentCommLeadId); if(!lead)return;
  const el=document.getElementById('commInboundNote');
  const note=(el?.value||'').trim();
  if(!note)return;
  ensureCommState(lead);
  lead.commLog.push({type:'Inbound reply',detail:note,at:new Date().toISOString()});
  lead.contactStatus='Responded';
  if(el)el.value='';
  persistLeadComm(lead);
  renderCommLog(lead);
  renderCommunications();
}

function callCurrentLead(){
  const lead=getLeadById(currentCommLeadId); if(!lead)return;
  const phone=document.getElementById('commPhone').value.trim();
  if(!phone){alert('Enter a verified phone number first.');return;}
  lead.phone=phone; persistLeadComm(lead);
  logComm('Call launched',phone);
  window.location.href=`tel:${phone.replace(/[^0-9+]/g,'')}`;
}
function sendCurrentLeadSMS(){
  const lead=getLeadById(currentCommLeadId); if(!lead)return;
  const phone=document.getElementById('commPhone').value.trim();
  const msg=document.getElementById('commMessage').value.trim();
  if(!phone){alert('Enter a verified phone number first.');return;}
  if(!msg){alert('Write a message first.');return;}
  lead.phone=phone; lead.smsDraft=msg; persistLeadComm(lead);
  logComm('Outbound SMS',msg);
  const p=phone.replace(/[^0-9+]/g,'');
  window.location.href=`sms:${p}?&body=${encodeURIComponent(msg)}`;
}

function daysUntil(dateStr){

 return Math.ceil((d-today)/86400000);

let radarLastResults=[];

function isoDatePlus(days){
  const d=new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function stateName(code){
  const m={CA:"California",FL:"Florida",NV:"Nevada",OH:"Ohio",GA:"Georgia",SC:"South Carolina",TX:"Texas"};
  return m[code]||code;
}
function nval(v){
  if(v===null||v===undefined||v==="") return null;
  const n=Number(String(v).replace(/[$,]/g,""));
  return Number.isFinite(n)?n:null;
}
function auctionRadarScore(c){
  let score=45;
  const eq=nval(c.estimatedEquity)||0;
  const value=nval(c.estimatedValue)||0;
  const bid=nval(c.openingBid)||0;
  const cushion=(value&&bid)?Math.max(0,value-bid):eq;
  if(cushion>=500000)score+=22;
  else if(cushion>=250000)score+=17;
  else if(cushion>=100000)score+=12;
  else if(cushion>=50000)score+=6;
  const pt=String(c.propertyType||"").toUpperCase();
  if(pt.includes("SFR")||pt.includes("SINGLE"))score+=10;
  if(c.individualOwned===true || (!c.corporateOwned && c.ownerName))score+=6;
  if(c.corporateOwned)score-=10;
  if(c.death||c.inherited)score-=5;
  if(c.lien||c.judgment)score-=4;
  const d=daysUntil(c.auctionDate);
  if(d>=7&&d<=90)score+=5;
  else if(d<7)score-=4;
  return Math.max(20,Math.min(95,Math.round(score)));
}
